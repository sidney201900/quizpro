version: '3.8'

services:
  # Frontend
  app:
    image: sidney201900/quizpro-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/api # Use a proxy or full URL
    depends_on:
      - api
    networks:
      - quiz-net
    deploy:
      replicas: 1

  # Backend API
  api:
    image: sidney201900/quizpro-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quizdb?schema=public
      - PORT=3001
    depends_on:
      - db
    networks:
      - quiz-net
    deploy:
      replicas: 1

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quizdb
    volumes:
      - quiz-db-data:/var/lib/postgresql/data
    networks:
      - quiz-net
    deploy:
      replicas: 1

networks:
  quiz-net:
    driver: overlay

volumes:
  quiz-db-data:
    driver: local
