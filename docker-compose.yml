version: '3.8'

services:
  # ============================
  # QUIZ MASTER - UNIFIED APP
  # ============================
  quiz-app:
    image: sidney201900/quizpro:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://quizuser:quizpass@quiz-db:5432/quizdb?schema=public
      - PORT=3001
      - VITE_API_URL=/api
    depends_on:
      - quiz-db
    networks:
      - quizpro-internal
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.quiz-pro.rule=Host(`quiz.microtecinformaticacurso.com.br`)"
        - "traefik.http.routers.quiz-pro.entrypoints=websecure"
        - "traefik.http.routers.quiz-pro.tls=true"
        - "traefik.http.routers.quiz-pro.tls.certresolver=letsencrypt"
        - "traefik.http.services.quiz-pro.loadbalancer.server.port=3001"
        - "traefik.docker.network=network_public"

  # ============================
  # QUIZ MASTER - DATABASE
  # ============================
  quiz-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=quizuser
      - POSTGRES_PASSWORD=quizpass
      - POSTGRES_DB=quizdb
    volumes:
      - quiz_pgdata:/var/lib/postgresql/data
    networks:
      - quizpro-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  quizpro-internal:
    driver: overlay
  network_public:
    external: true

volumes:
  quiz_pgdata:
