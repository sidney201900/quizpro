version: '3.8'

services:
  # Frontend
  app:
    image: sidney201900/quizpro-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    # ports: # Comentado porque o Traefik cuidará do roteamento na porta 80/443
    #   - "80:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - api
    networks:
      - quiz-net
      - traefik-public # Rede para comunicação com o Traefik
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.quizpro.rule=Host(`quiz.microtecinformaticacurso.com.br`)"
        - "traefik.http.routers.quizpro.entrypoints=websecure"
        - "traefik.http.routers.quizpro.tls.certresolver=letsencrypt"
        - "traefik.http.services.quizpro.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"

  # Backend API
  api:
    image: sidney201900/quizpro-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quizdb?schema=public
      - PORT=3001
    depends_on:
      - db
    networks:
      - quiz-net
    deploy:
      replicas: 1

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quizdb
    volumes:
      - quiz-db-data:/var/lib/postgresql/data
    networks:
      - quiz-net
    deploy:
      replicas: 1

networks:
  quiz-net:
    driver: overlay
  traefik-public:
    external: true # Assume que você já tem essa rede criada para o Traefik

volumes:
  quiz-db-data:
    driver: local
